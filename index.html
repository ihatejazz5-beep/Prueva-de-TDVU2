<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Figuras Geométricas</title>
</head>
<body>

<h1>Calculadora de Figuras Geométricas</h1>

<script>

// Presentación
alert("Hola, mi nombre es Carlos Emmanuel Benitez Reyes.");
alert("Este programa calcula el área y perímetro del círclo, rectánglo y trapecio.");

// CÍRCULO
let radio = parseFloat(prompt("Ingresa el radio del círculo:"));

let areaCirculo = Math.PI * radio * radio;
let perimetroCirculo = 2 * Math.PI * radio;

// RECTÁNGULO
let baseRect = parseFloat(prompt("Ingresa la base del rectángulo:"));
let alturaRect = parseFloat(prompt("Ingresa la altura del rectángulo:"));

let areaRectangulo = baseRect * alturaRect;
let perimetroRectangulo = 2 * (baseRect + alturaRect);

// TRAPECIO
let baseMayor = parseFloat(prompt("Ingresa la base mayor del trapecio:"));
let baseMenor = parseFloat(prompt("Ingresa la base menor del trapecio:"));
let alturaTrap = parseFloat(prompt("Ingresa la altura del trapecio:"));
let lado1 = parseFloat(prompt("Ingresa el lado izquierdo del trapecio:"));
let lado2 = parseFloat(prompt("Ingresa el lado derecho del trapecio:"));

let areaTrapecio = ((baseMayor + baseMenor) * alturaTrap) / 2;
let perimetroTrapecio = baseMayor + baseMenor + lado1 + lado2;

// Mostrar resultados
document.write("<h2>Resultados</h2>");

document.write("<h3>Círculo</h3>");
document.write("Área: " + areaCirculo.toFixed(2) + "<br>");
document.write("Perímetro: " + perimetroCirculo.toFixed(2) + "<br><br>");

document.write("<h3>Rectángulo</h3>");
document.write("Área: " + areaRectangulo.toFixed(2) + "<br>");
document.write("Perímetro: " + perimetroRectangulo.toFixed(2) + "<br><br>");

document.write("<h3>Trapecio</h3>");
document.write("Área: " + areaTrapecio.toFixed(2) + "<br>");
document.write("Perímetro: " + perimetroTrapecio.toFixed(2));

</script>

</body>
</html>
